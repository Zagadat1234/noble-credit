  <style>
    body {
      background: linear-gradient(135deg, #010a33, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      color: #333;
    }

    .auth-container {
      width: 400px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .auth-container h3 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .form-control {
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .form-control::placeholder {
      color: #eee;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25);
      color: white;
    }

    .btn-main {
      background-color: white;
      color: #56b8e6;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      background-color: #56b8e6;
      color: white;
    }

    .toggle-link {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }

    .feedback {
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .feedback.success { color: #8cffb3; }
    .feedback.error { color: #ff7f7f; }

    /* Toast Notifications */
    #toast {
      position: fixed;
      top: 25px;
      right: 25px;
      min-width: 250px;
      padding: 15px 20px;
      border-radius: 10px;
      background: #ffffff;
      color: white;
      display: none;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 9999;
      font-weight: 500;
    }

    #toast.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    #toast.success { background: #28a745; }
    #toast.error { background: #dc3545; }
    #toast.info { background: #007bff; }

    /* Password toggle */
    .password-wrapper {
      position: relative;
    }
    .password-wrapper i {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #fff;
    }

    /* Password strength */
    #strength-bar {
      height: 6px;
      border-radius: 5px;
      margin-top: 5px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    #strength-bar div {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>

  <div class="auth-container">

    <!-- Sign In -->
    <form id="loginForm">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required />
      </div>
      <div class="mb-3 password-wrapper">

      </div>
      <button type="submit" class="btn btn-main w-100 mt-3">Sign In</button>

        Don’t have an account?
        <span class="toggle-link" id="show-signup">Sign Up</span>

    </form>

    <!-- Sign Up -->
    <form id="signupForm" style="display: none">
      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required />
        <div id="name-feedback" class="feedback"></div>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="signup-email" class="form-control" placeholder="you@example.com" required />
        <div id="email-feedback" class="feedback"></div>
      </div>
      <div class="mb-3 password-wrapper">
        <label>Password</label>
        <input type="password" id="signup-password" class="form-control" placeholder="Create password" required />
        <i class="fa fa-eye" id="toggleSignupPassword"></i>
        <div id="strength-bar"><div></div></div>
        <div id="password-feedback" class="feedback"></div>
      </div>
      <button type="submit" class="btn btn-main w-100 mt-3">Sign Up</button>
      <p class="mt-3 text-center">
        Already have an account?
        <span class="toggle-link" id="show-login">Sign In</span>
      </p>
    </form>

  <!-- Main JS File -->
  <script src="assets/js/main.js"></script>

  <script src="script.js"></script>

  <script>
    // Selectors
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const showSignup = document.getElementById("show-signup");
    const showLogin = document.getElementById("show-login");
    const title = document.getElementById("form-title");
    const toast = document.getElementById("toast");

    // Toast function
    function showToast(msg, type = "info") {
      toast.textContent = msg;
      toast.className = "show " + type;
      setTimeout(() => (toast.className = toast.className.replace("show", "")), 3000);
    }

    // Form toggles
    showSignup.onclick = () => switchForm("signup");
    showLogin.onclick = () => switchForm("login");

    function switchForm(mode) {
      if (mode === "signup") {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        title.textContent = "Create Account";
        showToast("You’re now signing up", "info");
      } else {
        signupForm.style.display = "none";
        loginForm.style.display = "block";
        title.textContent = "Sign In";
        showToast("Welcome back!", "info");
      }
    }

    // Password toggle
    function togglePassword(fieldId, iconId) {
      const input = document.getElementById(fieldId);
      const icon = document.getElementById(iconId);
      icon.addEventListener("click", () => {
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
      });
    }

    togglePassword("signup-password", "toggleSignupPassword");
    togglePassword("login-password", "toggleLoginPassword");

    // Password strength meter
    const strengthBar = document.querySelector("#strength-bar div");
    const passwordField = document.getElementById("signup-password");
    const passwordFeedback = document.getElementById("password-feedback");

    passwordField.addEventListener("input", () => {
      const val = passwordField.value;
      let strength = 0;
      if (val.match(/[a-z]/)) strength++;
      if (val.match(/[A-Z]/)) strength++;
      if (val.match(/[0-9]/)) strength++;
      if (val.match(/[^a-zA-Z0-9]/)) strength++;

      const colors = ["", "#dc3545", "#fd7e14", "#ffc107", "#28a745"];
      const messages = ["", "Weak password", "Fair", "Good", "Strong"];

      strengthBar.style.width = strength * 25 + "%";
      strengthBar.style.background = colors[strength];
      passwordFeedback.textContent = messages[strength];
      passwordFeedback.className = "feedback " + (strength < 3 ? "error" : "success");
    });

    // Smart validation
    const emailField = document.getElementById("signup-email");
    const emailFeedback = document.getElementById("email-feedback");
    emailField.addEventListener("input", () => {
      const email = emailField.value.trim().toLowerCase();
      const users = JSON.parse(localStorage.getItem("users")) || [];
      if (users.find((u) => u.email === email)) {
        emailFeedback.textContent = "Email already registered";
        emailFeedback.className = "feedback error";
      } else {
        emailFeedback.textContent = "Email looks good";
        emailFeedback.className = "feedback success";
      }
    });

    const nameField = document.getElementById("signup-name");
    const nameFeedback = document.getElementById("name-feedback");
    nameField.addEventListener("input", () => {
      if (nameField.value.length >= 3) {
        nameFeedback.textContent = "Looks good";
        nameFeedback.className = "feedback success";
      } else {
        nameFeedback.textContent = "Name too short";
        nameFeedback.className = "feedback error";
      }
    });

    // Sign Up
    // --- SIGN UP ---
    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const name = nameField.value.trim();
      const email = emailField.value.trim().toLowerCase();
      const password = passwordField.value.trim();

      if (!name || !email || !password)
        return showToast("Please fill all fields", "error");

      let users = JSON.parse(localStorage.getItem("users")) || [];
      if (users.find((u) => u.email === email))
        return showToast("Email already registered", "error");

      const newUser = { name, email, password, joined: new Date().toISOString() };
      users.push(newUser);
      localStorage.setItem("users", JSON.stringify(users));

      // Save as logged in
      localStorage.setItem("loggedInUser", JSON.stringify(newUser));

      showToast("Account created successfully! Redirecting...", "success");
      signupForm.reset();

      setTimeout(() => (window.location.href = "dashboard.html"), 1500);
    });

    // --- SIGN IN ---
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document
        .getElementById("login-email")
        .value.trim()
        .toLowerCase();
      const password = document.getElementById("login-password").value.trim();

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const user = users.find((u) => u.email === email && u.password === password);

      if (!user) return showToast("Invalid credentials", "error");

      localStorage.setItem("loggedInUser", JSON.stringify(user));
      showToast(`Welcome back, ${user.name}!`, "success");
      setTimeout(() => (window.location.href = "dashboard.html"), 1500);
    });
    // Auto-login check
    const loggedUser = JSON.parse(localStorage.getItem("loggedInUser"));
    if (loggedUser) {
      showToast(`Auto-login as ${loggedUser.name}`, "info");
      setTimeout(() => (window.location.href = "dashboard.html"), 1200);
    }
    // Check if coming from a recent signup
    const signupSuccess = JSON.parse(localStorage.getItem("signupSuccess"));
    if (signupSuccess) {
      showToast(`Welcome, ${signupSuccess.name}! You can now sign in.`, "success");
      localStorage.removeItem("signupSuccess");
    }

  </script>
